services:
  db:
    image: postgres:16
    container_name: cryptokali_db
    restart: always
    environment:
      POSTGRES_USER: cryptokali
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cryptokali
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
