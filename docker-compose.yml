services:
  db:
    image: postgres:16
    container_name: apex_ai_db
    restart: always
    environment:
      POSTGRES_USER: apex_ai
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: apex_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
